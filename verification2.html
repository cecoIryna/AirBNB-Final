<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Verification</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header id="verify">
		<nav>
			<div class="logo">
				<a href="index.html"><img src="img\logo.svg" alt="logo"></a>
			</div>
			<div class="menu">
				<a href=""><p>Стати господарем</p></a>
				<a href=""><p>Збережене</p></a>
				<a href=""><p>Подорожі</p></a>
				<a href="registration.html" class="profile"><img src="img/iryna.png"></a>
			</div>
		</nav>
		<hr>
	</header>


	<section id="type" class="verify">
		<div class="box options">
			<h3>Виберіть відповідний тип посвідчення особи</h3>
			<input type="text" name="" class="input">
			<div class="pick">
			  <label class="row">
			    <div class="text">
			      <p>Посвідчення водія</p>
			    </div>
			    <input type="radio" name="photo" checked>
			    <span class="dot"></span>
			  </label>

			  <label class="row">
			    <div class="text">
			      <p>Паспорт</p>
			    </div>
			    <input type="radio" name="photo">
			    <span class="dot"></span>
			  </label>

			  <label class="row">
			    <div class="text">
			      <p>Посвідчення особи</p>
			      <p class="sub">Ваше посвідчення особи оброблятиметься відповідно до нашої <a href="">Політики конфіденційності та не надаватиметься господарю або гостям.</a></p>
			    </div>
			    <input type="radio" name="photo">
			    <span class="dot"></span>
			  </label>
			</div>
			<div class="bt">
				<a href="verification.html"><button class="bt_back">
					<img src="img/left.svg">Назад
				</button></a>
				<div class="button"><a href="verification3.html" ><button class="bt1">Продовжити</button></a></div>
			</div>
			
		</div>
		<div class=" box info"></div>
	</section>
</body>
</html>
