<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pay Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body id="pay_page">
    <main id="checkout_container">
        <div class="checkout_header">
            <a href="#" class="back_link">
                <a href="house2.html"><img src="img\Vector_right.svg"></a>
                <h1>Підтвердження й оплата</h1>
            </a>
        </div>
                    <div class="section_block">
                        <h3>Виберіть варіант оплати</h3>
                        
                        <div class="payment_selector">
                            <label class="radio_card active" onclick="selectPayment(this)">
                                <div class="radio_info">
                                    <p class="bolderT radio_title">Оплатити в повному обсязі</p>
                                    <p class="radio_desc">Сплатіть усю суму ($335.00) одразу.</p>
                                </div>
                                <input type="radio" name="payment_type" checked>
                                <span class="custom_radio"></span>
                            </label>

                            <label class="radio_card" onclick="selectPayment(this)">
                                <div class="radio_info">
                                    <p class="bolderT radio_title">Оплата двома частинами</p>
                                    <p class="radio_desc">$65.60 потрібно сплатити сьогодні, $262.40 – 22 груд. 2023р... Жодних додаткових зборів. <a href="#" class="bolderT">Докладніше</a></p>
                                </div>
                                <input type="radio" name="payment_type">
                                <span class="custom_radio"></span>
                            </label>
                        </div>
                    </div>

                    <hr>

                    <div class="section_block">
                        <h3>Оплатити за допомогою</h3>
                        
                        <div class="payment_method_top">
                            <select>
                                <option>Кредитна або дебетова картка</option>
                                <option>Google Pay</option>
                            </select>
                        </div>

                        <div class="credit_card_form">
                            <div class="together">
                                <div class="input_group full">
                                    <input type="text" placeholder="Номер картки">
                                </div>
                                <div class="input_group half_container">
                                    <input type="text" placeholder="Термін дії">
                                </div>
                                <div class="input_group">
                                    <input type="text" placeholder="CVV">
                                </div>
                            </div>
                            <div class="input_group simple_input">
                                <input type="text" placeholder="Індекс">
                            </div>
                            <div class="country-region">
                                <p>Країна/регіон</p>
                                <select class="country_select">
                                    <option>Україна</option>
                                    <option>Румунія</option>
                                    <option>Англія</option>
                                    <option>Польша</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="confirmation_area">
                        <button class="confirm_button">Підтвердити й оплатити</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="global_footer">
        <hr>
            <div class="footer_right">
                <div class="language">
                    <img src="img\language.svg">
                    <p>Українська (UA)</p>
                </div>
                
                <p>$ USD</p>
                <div class="social_icons">
                    <img src="img\facebook_line.svg">
                    <img src="img\instagram.svg">
                </div>
            </div>
        </div>
    </footer>

<script>
    function selectPayment(element) {
        document.querySelectorAll('.radio_card').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        element.querySelector('input').checked = true;
    }

    function selectPayment(element) {
        document.querySelectorAll('.radio_card').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        element.querySelector('input').checked = true;
    }

    const payBtn = document.querySelector('.confirmation_area .confirm_button');

    payBtn.addEventListener('click', function() {
        const cardNum = document.querySelector('input[placeholder="Номер картки"]');
        const cardDate = document.querySelector('input[placeholder="Термін дії"]');
        const cardCvv = document.querySelector('input[placeholder="CVV"]');

        if (cardNum.value === "" || cardDate.value === "" || cardCvv.value === "") {
            alert("Будь ласка, заповніть платіжні дані.");
            return;
        }


        window.location.href = "done.html"; 
    });
</script>
</body>
</html>
