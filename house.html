<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>House</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header id="house">
		<nav>
			<div class="logo">
				<a href="index.html"><img src="img\logo.svg" alt="logo"></a>
			</div>
			<div class="left">
				<div class=center>
					<div class="find">
						<p>Почніть пошук</p>
						<button><img src="img\search.svg" alt="search"></button>
					</div>

					<a href="###">Запропонувати помешкання на HomeFU</a>

				</div>
				<div class="menu">
					<a href="index.html"><img src="img\menu.svg" alt="menu"></a>
					<a href=""><img class="profile" src="img\profile.svg" alt="profile"></a>
				</div>
			</div>
		</nav>
	</header>

	<main id="m_house">
		<div class="title">
			<h1>Студія та спальня з панарамою на місто! Біля моря!</h1>
			<div class="under_title">
				<div class="rating">
					<div class="rating-value">
						<img src="img\star.svg" alt="profile">
						<span>4,95</span>
					</div>
					<div class="rating-count">
						<span>35 відгуків</span>
					</div>
					<div class="location">
						<span>Одеса, Одеська область, Україна</span>
					</div>
				</div>
				<div class="actions">
					<button class="share">
						<img src="img\share.svg" alt="share">
						<a href="###">Поділитися</a>
					</button>
					<button class="save">
						<img src="img\save.svg" alt="save">
						<a href="###">Зберегти</a>
					</button>
				</div>
			</div>
		</div>
	</main>

</body>
</html>
