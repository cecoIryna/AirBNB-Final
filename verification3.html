<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Verification</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header id="verify">
		<nav>
			<div class="logo">
				<a href="index.html"><img src="img\logo.svg" alt="logo"></a>
			</div>
			<div class="menu">
				<a href=""><p>Стати господарем</p></a>
				<a href=""><p>Збережене</p></a>
				<a href=""><p>Подорожі</p></a>
				<a href="" class="profile"><img src="img/iryna.png"></a>
			</div>
		</nav>
		<hr>
	</header>


	<section id="upload" class="verify">
		<div class="box options">
			<h3>Завантажте зображення свого посвідчення водія</h3>
			<p class="sub">Фотографії не мають бути розмиті, а на лицевому боці посвідчення водія має бути чітко видно ваше обличчя.</p>
			<div class="uploads">
				<label class="upload">
				    <input type="file" accept="image/png,image/jpeg">
				    <img src="img/card_face.svg" alt="card">
				    <p class="title">Завантажте лицевий бік</p>
				    <p class="sub">Лише JPEG або PNG</p>
				</label>

				<label class="upload">
				    <input type="file" accept="image/png,image/jpeg">
				    <img src="img/card_back.svg" alt="card">
				    <p class="title">Завантажте зворотній бік</p>
				    <p class="sub">Лише JPEG або PNG</p>
				</label>
			</div>
			<div class="bt">
				<a href="verification2.html"><button class="bt_back">
					<img src="img/left.svg">Назад
				</button></a>
				<div class="button"><a href="registration.html" ><button class="bt1">Продовжити</button></a></div>
			</div>
			
		</div>
		<div class=" box info"></div>
	</section>
</body>
</html>
