<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Gallery</title>
	<link rel="stylesheet" href="style.css">
</head>
<body id="gallery_main">
	<header>
		<a href="house.html"><img src="img\Vector_right.svg"></a>
		<div class="actions">
			<button class="share">
				<img src="img\share.svg" alt="share">
				<a href="###">Поділитися</a>
			</button>
			<button class="save">
				<img src="img\save.svg" alt="save">
				<a href="###">Зберегти</a>
			</button>
		</div>
	</header>
	<main id="big_photo_gallery">
		<div class="box_img">
			<div class="photo div1_p" data-img="img/flat_studio_photo1.png"></div>
			<div class="photo div2_p" data-img="img/flat_studio_photo2.png"></div>
			<div class="photo div3_p" data-img="img/flat_studio_photo3.png"></div>
			<div class="photo div4_p" data-img="img/flat_studio_photo4.png"></div>
			<div class="photo posC div5_p" data-img="img/flat_studio_photo5.png"></div>
			<div class="photo div6_p" data-img="img/flat_studio_photo6.png"></div>
			<div class="photo div7_p" data-img="img/flat_studio_photo7.png"></div>

		</div>
	</main>

	<div class="lightbox" id="lightbox">
	  <button class="close"><img src="img\close.png"></button>

	  <button class="nav prev"><img src="img\angle-left.png"></button>
	  <img class="lightbox-img" id="lightboxImg">
	  <button class="nav next"><img src="img\angle-right.png"></button>
	</div>

	<script>
		const photos = document.querySelectorAll('.photo');
		const lightbox = document.getElementById('lightbox');
		const lightboxImg = document.getElementById('lightboxImg');
		const closeBtn = document.querySelector('.lightbox .close');
		const nextBtn = document.querySelector('.lightbox .next');
		const prevBtn = document.querySelector('.lightbox .prev');

		let currentIndex = 0;

		// Открытие
		photos.forEach((photo, index) => {
		  photo.addEventListener('click', () => {
		    currentIndex = index;
		    openLightbox();
		  });
		});

		function openLightbox() {
		  lightbox.classList.add('active');
		  lightboxImg.src = photos[currentIndex].dataset.img;
		  document.body.style.overflow = 'hidden';
		}

		// Закрытие
		function closeLightbox() {
		  lightbox.classList.remove('active');
		  document.body.style.overflow = '';
		}

		closeBtn.addEventListener('click', closeLightbox);

		// Клик по фону
		lightbox.addEventListener('click', (e) => {
		  if (e.target === lightbox) closeLightbox();
		});

		// Переключение
		nextBtn.addEventListener('click', () => {
		  currentIndex = (currentIndex + 1) % photos.length;
		  openLightbox();
		});

		prevBtn.addEventListener('click', () => {
		  currentIndex = (currentIndex - 1 + photos.length) % photos.length;
		  openLightbox();
		});

		// Клавиатура
		document.addEventListener('keydown', (e) => {
		  if (!lightbox.classList.contains('active')) return;

		  if (e.key === 'ArrowRight') nextBtn.click();
		  if (e.key === 'ArrowLeft') prevBtn.click();
		  if (e.key === 'Escape') closeLightbox();
		});
	</script>


</body>
</html>
